# CI for Mero Tag.
#
# This replaces workflows/ci.yml, which sat next to the merobox scenarios with a
# comment reading "Mirror into .github/workflows/ to enable on GitHub" — so it
# was never active. It also declared `branches: [main]` while this repo's default
# is `master`, which is the failure mode that hides itself: mirroring it as-is
# would have produced a workflow that runs on no push at all.
name: ci

on:
  push:
    branches: [master]
  pull_request:

# Without this, a push landing on top of an in-flight push leaves BOTH runs to
# completion — and this repo's `app` job is a macOS runner, billed at ten times
# the Linux rate. Superseded runs are the most expensive thing here.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  logic:
    name: WASM contract (Rust)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: logic
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.89.0
        with:
          targets: wasm32-unknown-unknown
          components: clippy
      - name: Install cargo-mero
        uses: ./.github/actions/install-cargo-mero
      - run: cargo test
      - run: cargo clippy --target wasm32-unknown-unknown --profile app-release -- -D warnings
      # `cargo mero build`, not `bash build.sh`: the hand-rolled script produced a
      # wasm with no `calimero_abi_v1` section, so what CI proved was not what
      # shipped. This emits and embeds the ABI, which also means a public type
      # missing an `AbiType` impl fails here rather than at bundle time.
      - name: Build WASM (+ ABI embed)
        run: cargo mero build

  merokit:
    name: MeroKit (Swift)
    runs-on: macos-15
    defaults:
      run:
        working-directory: app/MeroKit
    steps:
      - uses: actions/checkout@v4
      # Pinned rather than inherited: the installed simulator runtimes differ per
      # Xcode, so a default bump silently changes what this job is testing.
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app
      # The verify binary is pure logic and needs no Xcode, so it runs first and
      # fails fast if the client cannot even construct its requests.
      - run: swift run merokit-verify
      - run: swift test

  app:
    name: iOS app build
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - working-directory: app/MeroTag
        run: xcodegen generate
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app

      # Addressed by UDID after waiting, not by name. On a cold runner
      # CoreSimulator is often not up yet, so xcodebuild's device list comes back
      # EMPTY and it fails after a 60s search with "no available devices matched"
      # even though the image ships plenty. Touching simctl starts the service.
      # A name like 'iPhone 17' additionally breaks whenever the image renames
      # its models.
      - name: Wait for a simulator, then run app tests
        working-directory: app/MeroTag
        env:
          # Empty on a debug re-run, so the full build transcript comes back.
          XCB_QUIET: ${{ runner.debug == '1' && '' || '-quiet' }}
        run: |
          set -euo pipefail
          udid=""
          for attempt in $(seq 1 20); do
            udid=$(xcrun simctl list devices available -j \
              | python3 -c 'import json,sys;d=json.load(sys.stdin)["devices"];print(next((x["udid"] for rt in d for x in d[rt] if "iPhone" in x["name"]), ""))')
            [ -n "$udid" ] && break
            echo "attempt $attempt: no iPhone simulator yet, waiting…"
            sleep 5
          done
          if [ -z "$udid" ]; then
            echo "::error::no iOS simulator became available — tests did NOT run"
            xcrun simctl list devices
            exit 1
          fi
          echo "using simulator $udid"
          xcrun simctl boot "$udid" || true
          # -quiet drops xcodebuild's build graph — the SwiftCompile /
          # WriteAuxiliaryFile / `cd …` lines that are 95% of this job's log and
          # tell you nothing when it passes. Warnings, errors and the test
          # summary still print. A debug re-run gets the full transcript back.
          xcodebuild test $XCB_QUIET -project MeroTag.xcodeproj -scheme MeroTag \
            -destination "platform=iOS Simulator,id=$udid" \
            -derivedDataPath .build -only-testing:MeroTagTests \
            CODE_SIGNING_ALLOWED=NO

  # Every *.yml under workflows/ becomes its own matrix leg, so adding a scenario
  # is adding a file — nothing here needs editing, which is what stopped
  # convergence-test.yml from being wired up twice and forgotten once.
  #
  # The empty-glob guard is not paranoia. A matrix built from a glob that matches
  # nothing produces ZERO legs and the job reports SUCCESS, so a renamed
  # directory reads as "all scenarios passed" — green by absence. Fail instead.
  discover-workflows:
    name: Discover merobox scenarios
    runs-on: ubuntu-latest
    outputs:
      scenarios: ${{ steps.find.outputs.scenarios }}
    steps:
      - uses: actions/checkout@v4
      - id: find
        run: |
          set -euo pipefail
          list=$(cd workflows && ls -1 *.yml 2>/dev/null | sort || true)
          if [ -z "$list" ]; then
            echo "::error::no *.yml under workflows/ — this lane would report success having run nothing"
            exit 1
          fi
          echo "scenarios=$(printf '%s\n' "$list" | jq -R -s -c 'split("\n")|map(select(length>0))')" >> "$GITHUB_OUTPUT"
          echo "will run:"; printf '  %s\n' $list

  logic-workflows:
    name: merobox (${{ matrix.scenario }})
    needs: [discover-workflows]
    runs-on: ubuntu-latest
    strategy:
      # One scenario's failure must not cancel the others: when a core release
      # changes behaviour they usually fail for the SAME reason, and seeing which
      # of them do is the diagnosis.
      fail-fast: false
      matrix:
        scenario: ${{ fromJSON(needs.discover-workflows.outputs.scenarios) }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.89.0
        with:
          targets: wasm32-unknown-unknown
      - run: sudo apt-get update && sudo apt-get install -y jq
      - name: Install cargo-mero
        uses: ./.github/actions/install-cargo-mero
      - name: Build WASM
        run: cd logic && cargo mero build
      # Both pinned. merobox only requires `calimero-client-py>=0.6.28`, and
      # client-py is the layer that actually builds the admin-API request — so an
      # unpinned install tracks core master and reddens this job on a commit that
      # changed nothing. The pair must match the merod image in workflows/.
      # merobox has had a console-verbosity knob since 0.6.30 (merobox#271): `quiet`
      # keeps the banners and the final pass/fail summary and drops the per-step
      # API-response dumps. Day to day that is what you want; to get the full detail
      # back, re-run the job with "Enable debug logging" and GitHub sets runner.debug,
      # which flips this to `verbose`. No second workflow, no flag to remember.
      #
      # It goes through $GITHUB_ENV rather than a workflow-level `env:` because the
      # `runner` context does not exist at workflow or job level — only inside a step.
      - name: Quiet merobox and its nodes on the happy path
        run: |
          # merobox's own console output.
          echo "MEROBOX_LOG_LEVEL=${{ runner.debug == '1' && 'verbose' || 'quiet' }}" >> "$GITHUB_ENV"
          # RUST_LOG for the merod nodes merobox boots. This has to go on the CLI:
          # `bootstrap run --log-level` defaults to "debug", so the value is never
          # None and merobox's `config.get("log_level")` fallback is unreachable — a
          # `log_level:` key in the workflow YAML is silently ignored.
          echo "MEROD_LOG=${{ runner.debug == '1' && 'debug' || 'info' }}" >> "$GITHUB_ENV"
      # calimero-client-py publishes an sdist and no manylinux wheel, so a cold
      # `pip install` compiles its Rust extension on the runner — 92 seconds of a
      # 134-second step, measured. pip stores wheels it builds itself under
      # ~/.cache/pip/wheels and reuses them, so keying this cache on the exact pins
      # makes every run after the first a few seconds. Bump the key with the pins.
      - name: Cache pip (calimero-client-py builds from source)
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-merobox-0.6.55-ccpy-0.6.29
      - name: Install merobox
        run: |
          pip install -q --disable-pip-version-check "merobox==0.6.55" "calimero-client-py==0.6.29"
          merobox --version
          pip show calimero-client-py | sed -n 's/^Version: /calimero-client-py /p'
      # Schema-check first: a typo in a step name or field otherwise only shows up
      # after several minutes of node boot.
      #
      # SCENARIO travels through the environment rather than being interpolated
      # into the script. A `${{ }}` expression is substituted before the shell
      # sees the line, and this value comes from a filename in the repo, so
      # inlining it would let a crafted name run as code.
      - name: Validate workflow schema
        env:
          SCENARIO: ${{ matrix.scenario }}
        run: cd workflows && merobox bootstrap validate "$SCENARIO"
      - name: Run merobox workflow (boots merod in Docker)
        env:
          SCENARIO: ${{ matrix.scenario }}
        run: bash scripts/workflows.sh "$SCENARIO"
