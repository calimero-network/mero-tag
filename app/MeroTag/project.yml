# XcodeGen spec — regenerate MeroTag.xcodeproj with: `xcodegen generate`
# (from this directory) or `make app-gen` from the repo root.
name: MeroTag
options:
  bundleIdPrefix: network.calimero
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  # The official Calimero Swift SDK (MeroKit + MeroKitUI), Calimero 1.0:
  # `CalimeroClient` over the sealed channel (attestation, passkeys, app
  # calls/views/events, orgs and invites, consent) and `MeroClient` for
  # sign-in state. Pinned to the v0.6.0 release — never `master`. To build
  # against a local checkout instead, swap `url`/`exactVersion` for
  # `path: ../../../swift-sdk`, but never commit that.
  MeroKit:
    url: https://github.com/calimero-network/swift-sdk
    exactVersion: 0.6.0

targets:
  MeroTag:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources
    # Native passkeys on a production cluster: its relying party is
    # `calimero.network`, which publishes this app in its
    # apple-app-site-association (`webcredentials`). Device builds also need
    # a signing team (DEVELOPMENT_TEAM below).
    entitlements:
      path: MeroTag.entitlements
      properties:
        com.apple.developer.associated-domains:
          - webcredentials:calimero.network
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Mero Tag
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        NSLocationWhenInUseUsageDescription: "Mero Tag shares your live location with people you authorize."
        NSLocationAlwaysAndWhenInUseUsageDescription: "Mero Tag keeps sharing your location in the background so your group always sees where you are."
        # `merod local` development clusters are plain http on the LAN.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription: "Mero Tag connects to a development Calimero cluster on your network."
        UIBackgroundModes:
          - location
          - fetch
        # Invite deep links: merotag://join?invitation=…
        CFBundleURLTypes:
          - CFBundleURLName: network.calimero.merotag.join
            CFBundleURLSchemes:
              - merotag
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: network.calimero.merotag
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5"
        # Set your team here (or pass DEVELOPMENT_TEAM=XXXX to xcodebuild) for device builds.
        # DEVELOPMENT_TEAM: ""
    dependencies:
      - package: MeroKit
        product: MeroKit
      - package: MeroKit
        product: MeroKitUI

  MeroTagTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: MeroTag
      - package: MeroKit
        product: MeroKit
      - package: MeroKit
        product: MeroKitUI

  MeroTagUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
        optional: true
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: MeroTag

schemes:
  MeroTag:
    build:
      targets:
        MeroTag: all
    run:
      config: Debug
    test:
      targets:
        - MeroTagTests
        - MeroTagUITests
