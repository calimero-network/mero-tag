name: Mero Tag Convergence (2 nodes, partitioned)
description: >
  What the single-node scenario cannot test: that two nodes editing the same
  space CONVERGE, and converge to the same thing.

  Every stored record is `#[app::mergeable]`, so the merge rule lives in the
  wasm and the host dispatches to it when an entry diverges. Nothing exercised
  that. logic-test.yml boots ONE node, where a write is a plain sequential
  write and no merge is ever reached — so the six merge rules could be
  arbitrarily wrong and every lane stayed green. Two of them were: before
  core 0.11.0-rc.32 required the merge to be DECLARED, none of them was
  dispatched at all, and once dispatched a timestamp tie left each replica
  holding its own copy and `History` discarded one side's samples outright.

  A partition is what makes the divergence real. Steps run in sequence, so
  without one, node 2's write lands after node 1's has already replicated —
  the entry never forks, no merge runs, and the assertions below would pass
  against the OLD buggy rules. `partition_peers` cuts libp2p while leaving
  RPC up, so each node accepts a write the other cannot see.

  Two properties, both asserted on BOTH nodes (a rule that converges on one
  node and not the other is the exact failure mode being guarded):

    1. `History` UNIONS append-only samples. Each side records one fix while
       partitioned, so both hold a one-element list. The rule this replaced
       was `if other.samples.len() > self.samples.len()`, under which 1 > 1
       is false, each node keeps its own, and they never converge. So this
       assertion fails closed on a regression rather than merely looking odd.

    2. The tracker resolves last-writer-wins on the HIGHER timestamp,
       whichever node it came from. Node 2's fix is stamped later, so both
       nodes must end up on node 2's coordinates even though node 1 wrote
       first.

  The latitudes are deliberately odd values (11.25 / 22.75) that appear
  nowhere else in the scenario, so `contains` cannot pass on an incidental
  substring of a timestamp or an id.

stop_all_nodes: true
restart: false
wait_timeout: 180

nodes:
  chain_id: testnet-1
  count: 2
  # Must match `min-runtime-version`; see the note in logic-test.yml. It also
  # has to be a release whose HOST can call back into the wasm to merge a
  # custom-stamped collection entry, which is what property 1 rests on.
  image: ghcr.io/calimero-network/merod:0.11.0-rc.32
  prefix: calimero-node

steps:
  # ── Bootstrap ─────────────────────────────────────────────────────────────
  # Both nodes: each executes the context locally, so each needs the bytecode.
  # The same wasm installs to the same application id on both, so only node 1's
  # is captured.
  - name: Install Application on Node 1
    type: install_application
    node: calimero-node-1
    path: "../logic/res/mero_tag.wasm"
    dev: true
    outputs:
      app_id: applicationId

  - name: Install Application on Node 2
    type: install_application
    node: calimero-node-2
    path: "../logic/res/mero_tag.wasm"
    dev: true

  # Replaces the namespace/invite/join dance. `params` is not optional here —
  # this app's `init` takes a name, and a context created without it fails as a
  # bare 500 that says nothing about why.
  - name: Create the Shared Space Across Both Nodes
    type: create_mesh
    context_node: calimero-node-1
    application_id: "{{app_id}}"
    params: '{"name": "Converge Space"}'
    nodes:
      - calimero-node-2
    outputs:
      context_id: contextId
      member_public_key: memberPublicKey

  # Cold join: core hands the group key over gossip and a read issued too early
  # answers before the join has settled.
  - name: Settle the Join
    type: wait
    seconds: 8

  # ── One shared tracker, created on node 1 ─────────────────────────────────
  # One ascending clock, as in logic-test.yml: the merge arbitrates on these.
  - name: Node 1 Registers Alice
    type: call
    node: calimero-node-1
    context_id: "{{context_id}}"
    executor_public_key: "{{member_public_key}}"
    method: join
    args:
      member_id: "alice"
      username: "Alice"
      timestamp: 1000

  - name: Node 1 Creates the Tracker
    type: call
    node: calimero-node-1
    context_id: "{{context_id}}"
    executor_public_key: "{{member_public_key}}"
    method: create_tracker
    args:
      id: "t1"
      name: "Shared Phone"
      owner_id: "alice"
      created_at: 1100

  - name: Replicate the Tracker to Node 2
    type: wait_for_sync
    context_id: "{{context_id}}"
    nodes:
      - calimero-node-1
      - calimero-node-2
    timeout: 90
    check_interval: 2
    trigger_sync: true

  # `wait_for_sync` compares state hashes and can answer before a just-applied
  # delta is readable, so the handoff is followed by a real wait AND gated on a
  # read of node 1's write. Without this gate a later failure could not be told
  # apart from "the tracker never arrived".
  - name: Settle Before Reading on Node 2
    type: wait
    seconds: 5

  - name: Node 2 Can See the Tracker
    type: call
    node: calimero-node-2
    context_id: "{{context_id}}"
    method: get_trackers
    args: {}
    outputs:
      trackers_node2: result

  - name: Assert Replication Worked
    type: assert
    statements:
      - "contains({{trackers_node2}}, 't1')"
      - "contains({{trackers_node2}}, 'Shared Phone')"

  # ── Partition, so the next two writes genuinely fork ──────────────────────
  # libp2p only; both nodes stay RPC-reachable, which is what lets each accept
  # a write the other cannot see.
  - name: Cut the Link Between the Two Nodes
    type: partition_peers
    node: calimero-node-1
    peers:
      - calimero-node-2

  - name: Let the Partition Take Effect
    type: wait
    seconds: 8

  # Node 1 writes first and stamps EARLIER, so LWW must not resolve by arrival
  # order. Its latitude must survive in history and must lose on the tracker.
  - name: Node 1 Records a Fix While Isolated
    type: call
    node: calimero-node-1
    context_id: "{{context_id}}"
    executor_public_key: "{{member_public_key}}"
    method: update_location
    args:
      tracker_id: "t1"
      latitude: 11.25
      longitude: 1.0
      altitude: 0.0
      speed: 0.0
      heading: 0.0
      battery: 50
      timestamp: 2000

  # `executor_public_key` is omitted deliberately: the identity that executes on
  # a joined node is the one its membership materialised, not one a workflow can
  # name, and passing the wrong key still succeeds — the node signs with what it
  # owns — leaving a mismatch to surface later as a lookup against an id nobody
  # recorded.
  - name: Node 2 Records a Different Fix While Isolated
    type: call
    node: calimero-node-2
    context_id: "{{context_id}}"
    method: update_location
    args:
      tracker_id: "t1"
      latitude: 22.75
      longitude: 2.0
      altitude: 0.0
      speed: 0.0
      heading: 0.0
      battery: 60
      timestamp: 2100

  # ── Heal, and require both sides to agree ─────────────────────────────────
  - name: Heal the Partition
    type: heal_peers
    node: calimero-node-1
    peers:
      - calimero-node-2

  - name: Reconverge After Heal
    type: wait_for_sync
    context_id: "{{context_id}}"
    nodes:
      - calimero-node-1
      - calimero-node-2
    timeout: 120
    check_interval: 2
    trigger_sync: true

  - name: Settle After Reconvergence
    type: wait
    seconds: 10

  # ── Property 1: history unioned, on BOTH nodes ────────────────────────────
  - name: Read History on Node 1
    type: call
    node: calimero-node-1
    context_id: "{{context_id}}"
    executor_public_key: "{{member_public_key}}"
    method: get_history
    args:
      tracker_id: "t1"
      since: 0
    outputs:
      history_node1: result

  - name: Assert Node 1 Holds Both Fixes
    type: assert
    statements:
      - "contains({{history_node1}}, '11.25')"
      - "contains({{history_node1}}, '22.75')"

  - name: Read History on Node 2
    type: call
    node: calimero-node-2
    context_id: "{{context_id}}"
    method: get_history
    args:
      tracker_id: "t1"
      since: 0
    outputs:
      history_node2: result

  - name: Assert Node 2 Holds Both Fixes
    type: assert
    statements:
      - "contains({{history_node2}}, '11.25')"
      - "contains({{history_node2}}, '22.75')"

  # ── Property 2: the later timestamp wins the tracker, on BOTH nodes ───────
  - name: Read the Tracker on Node 1
    type: call
    node: calimero-node-1
    context_id: "{{context_id}}"
    executor_public_key: "{{member_public_key}}"
    method: get_tracker
    args:
      id: "t1"
    outputs:
      tracker_node1: result

  - name: Assert Node 1 Took the Later Fix
    type: assert
    statements:
      - "contains({{tracker_node1}}, '22.75')"
      - "contains({{tracker_node1}}, '2100')"

  - name: Read the Tracker on Node 2
    type: call
    node: calimero-node-2
    context_id: "{{context_id}}"
    method: get_tracker
    args:
      id: "t1"
    outputs:
      tracker_node2: result

  - name: Assert Node 2 Agrees With Node 1
    type: assert
    statements:
      - "contains({{tracker_node2}}, '22.75')"
      - "contains({{tracker_node2}}, '2100')"
